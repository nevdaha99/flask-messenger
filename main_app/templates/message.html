<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Підтвердження пошти</title>
</head>

<body style="
            margin: 0;
            padding: 30px 10px;
            background-color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            color: #070A1C;
        ">

  <!-- Основной контейнер -->
  <div style="
                max-width: 1035px;
                margin: 0 auto;
                border: 1px solid #AEB4C2;
                border-radius: 12px;
                background-color: #ffffff;
            ">

    <!-- Внутренний контейнер -->
    <div style="
                    width: 545px;
                    max-width: calc(100% - 40px);
                    margin: 0 auto;
                    padding: 32px 0 45px 0;
                ">

      <!-- Заголовок -->
      <h1 style="
                        margin: 0 0 22px 0;
                        color: #070A1C;
                        font-size: 28px;
                        line-height: 1.2;
                        font-weight: 700;
                        text-align: left;
                    ">
        Вас вітає команда World IT !
      </h1>

      <!-- Описание -->
      <p style="
                        margin: 0;
                        color: #0F172A;
                        font-size: 16px;
                        line-height: 1.25;
                        text-align: left;
                    ">
        Щоб завершити реєстрацію та переконатися, що саме ви є<br>
        власником цієї електронної адреси, будь ласка, підтвердіть свою<br>
        пошту.
      </p>

      <!-- Кнопка -->
      <div style="
                        margin-top: 24px;
                    ">
        <a href="http://127.0.0.1:5000/verify/{{token}}" style="
                            display: block;
                            width: 100%;
                            padding: 11px 0;
                            background-color: #070A1C;
                            color: #ffffff;
                            text-decoration: none;
                            text-align: center;
                            border-radius: 5px;
                            font-size: 15px;
                            line-height: 18px;
                        ">
          Підтвердити пошту
        </a>
      </div>

      <!-- Картинка -->
      <div style="
                        text-align: center;
                        margin-top: 28px;
                    ">
        <img src="https://i.ibb.co/kgFb6SJ9/image.png" alt="" width="340" style="
                                display: block;
                                width: 340px;
                                max-width: 100%;
                                height: auto;
                                margin: 0 auto;
                                border: 0;
                            ">
      </div>

      <!-- Разделитель -->
      <div style="
                        margin-top: 32px;
                        border-top: 1px solid #AEB4C2;
                        height: 1px;
                        font-size: 0;
                        line-height: 0;
                    ">
      </div>

      <!-- Нижний текст -->
      <p style="
                        margin: 26px 0 0 0;
                        color: #0F172A;
                        font-size: 14px;
                        line-height: 1.25;
                        text-align: left;
                    ">
        Якщо у вас виникнуть питання — ми завжди раді допомогти!<br>
        З найкращими побажаннями, команда World IT Academy
      </p>

    </div>
  </div>

</body>

</html>
